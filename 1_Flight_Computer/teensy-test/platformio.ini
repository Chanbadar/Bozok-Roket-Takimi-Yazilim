; =========================================================================================
; TEKNOFEST 2026 ROKET UKB - PLATFORMIO AYAR DOSYASI (platformio.ini)
; Hedef Kart: Teensy 4.1 (ARM Cortex-M7 @ 600 MHz)
; =========================================================================================

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
; Seri Monitor Haberlesme Hizi:
; Yazdigimiz test kodunun Serial.begin(115200) ayari ile tam uyumlu calismasi icin:
monitor_speed = 115200

; Seri Port Filtreleri (Temiz cikti icin):
monitor_filters = default

; Derleyici Bayraklari (USB Seri Port ile iletisim icin):
build_flags = 
    -D USB_SERIAL

; =========================================================================================
; KUTUPHANE (lib_deps) NOTU:
; Yazdigimiz test kodu standalone (dahili gomulu suruculu) olarak tasarlandigi icin
; harici hicbir kutuphane indirmenize veya "lib_deps" eklemenize GEREK YOKTUR!
; Bu sayede kutuphane cakismalari ve derleme hatalari %100 engellenmistir.
; =========================================================================================
